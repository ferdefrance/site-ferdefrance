<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Fer de France — site en refonte</title>
<style>
  :root {
    --rouge: #e20c49;
    --sombre: #1c1c1c;
    --fond: #edeff2;
    --texte: #333333;
    --texte-clair: #666666;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--fond);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    color: var(--texte);
    padding: 24px;
  }
  main {
    max-width: 480px;
    text-align: center;
    background: #fff;
    border-top: 4px solid var(--rouge);
    border-radius: 4px;
    padding: 40px 32px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.08);
  }
  h1 {
    font-size: 1.4rem;
    color: var(--sombre);
    margin: 0 0 16px;
  }
  p {
    color: var(--texte-clair);
    line-height: 1.6;
    margin: 0 0 12px;
  }
  a {
    color: var(--rouge);
    text-decoration: none;
  }
  a:hover { text-decoration: underline; }
</style>
</head>
<body>
<main>
  <h1>Fer de France</h1>
  <p>Le site est temporairement indisponible le temps d'une refonte.</p>
  <p>Pour nous contacter : <a href="mailto:contact@ferdefrance.fr">contact@ferdefrance.fr</a></p>
</main>
</body>
</html>
